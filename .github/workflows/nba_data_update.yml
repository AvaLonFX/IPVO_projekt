name: NBA Data Update

on:
  # Scheduled refresh now runs on the owner's laptop. Keep manual dispatch only.
  workflow_dispatch:  # Allows manual triggering of the action

jobs:
  update-data:
    runs-on: ubuntu-latest  # Use the latest Ubuntu image for the job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-pipeline.lock.txt

      - name: Run NBA Data Update Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}  # Store your Supabase URL in GitHub secrets
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NBA_SEASON: '2025-26'
        run: python components/scripte/update_nba_players.py
